version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hermes_db
    restart: always
    command: ["postgres", "-c", "timezone=${TZ:-America/Manaus}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 
      
  redis:
    image: redis:alpine
    container_name: hermes_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
      
  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: dockerfile
    command: ["npm", "run", "start:api"]
    container_name: hermes_api
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3001
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
      
  email-worker:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: dockerfile
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  system-worker:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: dockerfile
    command: ["npm", "run", "start:system-worker"]
    container_name: hermes_system_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  scaler:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: dockerfile
    command: ["npm", "run", "start:scaler"]
    container_name: hermes_scaler
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # Permite ao scaler falar com o Docker do HOST (para rodar 'docker compose --scale')
      - /var/run/docker.sock:/var/run/docker.sock
      # Este diretório (onde está o docker-compose.yml + .env) montado dentro do scaler, como /deploy — é como ele acha o compose file pra escalar.
      - .:/deploy:ro

  frontend:
    profiles: ["prod"]
    build:
      context: ../hermes-front
      dockerfile: dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: hermes_front
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production

volumes:
  pgdata:
    name: hermes_pgdata
  redisdata:
    name: hermes_redisdata
